name: 功能建議
description: 想要 Sapling 多做什麼
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解決什麼問題
      description: 說說你遇到的情況，比直接說要什麼功能更有幫助。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望怎麼做
      description: 如果其他啟動器有類似的功能，也可以說說。
