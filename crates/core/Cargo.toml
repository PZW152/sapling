[package]
name = "sapling-core"
version = "0.2.0"
description = "Sapling launcher core logic (no UI code)"
authors = ["PZW152"]
edition = "2024"

[lib]
name = "sapling_core"

[dependencies]
dirs = "7.0.0"
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
