[package]
name = "sapling-core"
version = "0.5.0"
description = "Sapling launcher core logic (no UI code)"
authors = ["PZW152"]
edition = "2024"

[lib]
name = "sapling_core"

[dependencies]
dirs = "7.0.0"
keyring = "4.2"
md-5 = "0.11.0"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
