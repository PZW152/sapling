[package]
name = "sapling-core"
version = "0.1.0"
description = "Sapling launcher core logic (no UI code)"
authors = ["PZW152"]
edition = "2024"

[lib]
name = "sapling_core"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
